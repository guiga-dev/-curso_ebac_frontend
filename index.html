<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" hidden alt="Foto do perfil">
            <h1 class="profile-name">Meu GitHub</h1>
            <h2 class="profile-username">Carregando perfil…</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repositorios">—</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="seguidores">—</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="seguindo">—</span>
                </li>
            </ul>
            <a class="profile-link" hidden>Ver no Github</a>
            <p id="status" role="status" aria-live="polite"></p>
            <button id="tentar-novamente" type="button" hidden>Tentar novamente</button>
        </div>
    </header>
    <script src="main.js" defer></script>
</body>
</html>
